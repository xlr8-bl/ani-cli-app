name: Debug APK

# Builds an installable (debug-signed) APK in the cloud — no keystore needed.
# Runs on every push to the dev branch and on manual dispatch, and uploads the
# APK as a downloadable artifact you can sideload straight from your phone.

on:
  workflow_dispatch:
  push:
    branches:
      - claude/xlr8-anime-app-ppkbsh

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: XLR8-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            **/build/reports/**
            **/*.log
          if-no-files-found: ignore
