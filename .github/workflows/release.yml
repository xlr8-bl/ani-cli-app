name: Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Decode keystore
        env:
          XLR8_KEYSTORE_BASE64: ${{ secrets.XLR8_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$XLR8_KEYSTORE_BASE64" ]; then
            echo "$XLR8_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
            echo "XLR8_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "Keystore decoded; release build will be signed."
          else
            echo "No keystore secret set; release build will use the debug signing key."
          fi

      - name: Build release APKs
        env:
          XLR8_KEYSTORE_PASSWORD: ${{ secrets.XLR8_KEYSTORE_PASSWORD }}
          XLR8_KEY_ALIAS: ${{ secrets.XLR8_KEY_ALIAS }}
          XLR8_KEY_PASSWORD: ${{ secrets.XLR8_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p dist
          find app/build/outputs/apk/release -name '*.apk' -exec cp {} dist/ \;
          ls -la dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
